[package]
name = "rlayout-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/application.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rlayout"
path = "src/main.rs"

[dependencies]
rlayout-gds.workspace = true
rlayout-viewer.workspace = true
eframe.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = ["Window", "Document", "HtmlCanvasElement", "HtmlInputElement", "File", "FileList", "Blob", "Event", "EventTarget", "KeyboardEvent", "console"] }
web-time = "=1.1.0"

[lints]
workspace = true
